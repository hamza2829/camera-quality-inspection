[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-quality-inspection"
version = "0.1.0"
description = "Synthetic-only CPU vision and mocked MQTT-to-SQLite inspection example"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "torch==2.7.1",
  "paho-mqtt==2.1.0",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["camera_quality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=artifacts/pytest-tmp"
