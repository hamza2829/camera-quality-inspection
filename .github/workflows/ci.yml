name: CPU inspection checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    name: C++ tests, Python tests, and CPU detectors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "20261101"
      YOLO_CONFIG_DIR: ${{ github.workspace }}/artifacts/yolo-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and dependencies
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,detector]"
      - name: Build C++17 module and run Google Test
        run: |
          mkdir -p artifacts
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --output-junit "$GITHUB_WORKSPACE/artifacts/cpp-tests.xml"
      - name: Pytest (no network broker)
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: CPU CNN, five YOLO epochs, held-out evaluation, and C++ timing
        timeout-minutes: 6
        run: python -m camera_quality.extension_experiment --output artifacts/extended --yolo-epochs 5
      - name: Publish measured evaluation in run summary
        run: cat artifacts/extended/extended-evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve tests, metrics, data, model, and examples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-cpu-evaluation
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
