name: CPU inspection checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    name: Tests and synthetic CPU benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "20261101"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Pytest (no network broker)
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Train and evaluate on CPU
        run: python -m camera_quality.experiment --output artifacts/benchmark --epochs 10
      - name: Publish measured evaluation in run summary
        run: cat artifacts/benchmark/evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve tests, metrics, data, model, and examples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-cpu-evaluation
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
